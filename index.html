
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famemart AI</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px}
.card{background:#1e293b;padding:12px;border-radius:10px;margin:10px 0}
input,button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px}
button{background:#7c3aed;color:#fff}
#out{background:#111827;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<h2>🚀 Famemart AI</h2>
<p>Grow Your Social Media</p>

<div class="card">📈 Instagram Followers</div>
<div class="card">❤️ Likes & Comments</div>
<div class="card">🎬 Reel & Video Views</div>

<h3>AI Caption Generator</h3>
<input id="topic" placeholder="Enter topic">
<button onclick="gen()">Generate Caption</button>
<div id="out">Your caption will appear here...</div>

<h3>Upgrade Pro ₹49</h3>
<p>UPI: <b>famemart@upi</b></p>
<input id="utr" placeholder="Enter 12 digit UTR">
<button onclick="saveUTR()">Submit Payment</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB2AHtSwRE_H5rDXiE4t7BBRZk1T4r2t8M",
  authDomain:"famemart-ai-4e56c.firebaseapp.com",
  projectId:"famemart-ai-4e56c",
  appId:"1:957546967412:web:fe72fced469193e5403c21"
});

const db = getFirestore(app);

window.saveUTR = async () => {
  const utr = document.getElementById("utr").value.trim();
  if(utr.length<8) return alert("Enter valid UTR");

  await addDoc(collection(db,"payments"),{
    utr,status:"pending",time:Date.now()
  });

  alert("Payment Submitted!");
  document.getElementById("utr").value="";
};
</script>

<script>
function gen(){
 const t=document.getElementById("topic").value.trim().toLowerCase();
 if(!t) return alert("Enter video title");

 let tags=["#viral","#fyp","#trending","#reels"];

 if(t.includes("car"))
   tags.push("#cars","#supercar","#drift","#carlover");

 if(t.includes("gym")||t.includes("fitness"))
   tags.push("#gym","#fitness","#workout","#bodybuilding");

 if(t.includes("food"))
   tags.push("#food","#foodie","#recipe","#streetfood");

 if(t.includes("travel"))
   tags.push("#travel","#wanderlust","#nature","#explore");

 if(t.includes("tech")||t.includes("ai"))
   tags.push("#tech","#ai","#gadgets","#technology");

 document.getElementById("out").innerHTML =
   `🔥 ${t} deserves to go viral!\n\n${tags.join(" ")}`;
}
</script>

</body>
</html>
