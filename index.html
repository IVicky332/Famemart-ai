<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Famemart AI</title>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
header{padding:18px;text-align:center;background:#6d28d9}
section{padding:20px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}
.btn{display:block;background:#7c3aed;color:#fff;text-align:center;padding:14px;border-radius:10px;text-decoration:none}
input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
</style>
</head>
<body>
<header><h2>🚀 Famemart AI</h2></header>

<section>
<h3>Our Services</h3>
<div class="card">📈 Instagram Followers</div>
<div class="card">❤️ Likes & Comments</div>
<div class="card">🎬 Reel Views</div>

<h3>AI Caption Tool</h3>
<input id="topic" placeholder="Enter topic">
<a class="btn" onclick="gen()">Generate</a>
<p id="out"></p>

<h3>Upgrade Pro ₹49</h3>
<p>UPI ID: famemart@upi</p>
<input placeholder="Enter UTR Number">
<a class="btn">Submit UTR</a>
</section>

<script>
function gen(){
let t=document.getElementById("topic").value;
document.getElementById("out").innerHTML=
"🔥 Grow with "+t+"<br>#viral #instagram #famemart";
}
</script>
</body>
</html>
